<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "CTI Aggregator" }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="brand">
        <span class="brand-dot"></span>
        CTI&nbsp;Aggregator
      </a>
      <a href="/" class="nav-link {% if active=='dashboard' %}active{% endif %}">Dashboard</a>
      <a href="/feeds" class="nav-link {% if active=='feeds' %}active{% endif %}">Feeds</a>
      <a href="/keywords" class="nav-link {% if active=='keywords' %}active{% endif %}">Keywords</a>
      <div class="nav-spacer"></div>
      <div class="nav-meta">
        <span class="pulse"></span>local · 127.0.0.1:8000
      </div>
    </div>
  </nav>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
